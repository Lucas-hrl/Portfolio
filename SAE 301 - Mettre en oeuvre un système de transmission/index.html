{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <title>Contrôle Prises MQTT</title>
</head>
<body>
    <div class="container">
        <h1>🏠 Contrôle des Prises Connectées</h1>
        
        <div class="grid">
            {% for nom, etat in etats.items %}
                <div class="bloc-prise">
                    <div class="device-name">
                        {{ nom }}
                        <span class="status-indicator {% if etat == 'ON' %}active{% else %}inactive{% endif %}" id="indicator-{{ nom }}"></span>
                    </div>
                    
                    <form method="post" action="{% url 'toggle' nom %}">
                        {% csrf_token %}
                        <button id="btn-{{ nom }}" type="submit" class="btn {% if etat == 'ON' %}on{% else %}off{% endif %}">
                            {% if etat == "ON" %}
                                ⚡ Éteindre
                            {% else %}
                                💡 Allumer
                            {% endif %}
                        </button>
                    </form>
                    
                    {% if nom in temperatures %}
                        <div class="temperature" id="temp-{{ nom }}">
                            <span>{{ temperatures.nom }} °C</span>
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
        
        <div class="last-update" id="last-update">
            Dernière mise à jour : <span id="update-time">--:--:--</span>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const time = now.toLocaleTimeString('fr-FR');
            document.getElementById('update-time').textContent = time;
        }

        async function refreshEtats() {
            try {
                const response = await fetch("{% url 'get_etats' %}");
                const data = await response.json();
                
                // MAJ états
                for (const [nom, etat] of Object.entries(data.etats)) {
                    const btn = document.getElementById("btn-" + nom);
                    const indicator = document.getElementById("indicator-" + nom);
                    
                    if (btn) {
                        if (etat === "ON") {
                            btn.classList.add("on");
                            btn.classList.remove("off");
                            btn.innerHTML = "⚡ Éteindre";
                            if (indicator) {
                                indicator.classList.add("active");
                                indicator.classList.remove("inactive");
                            }
                        } else {
                            btn.classList.add("off");
                            btn.classList.remove("on");
                            btn.innerHTML = "💡 Allumer";
                            if (indicator) {
                                indicator.classList.add("inactive");
                                indicator.classList.remove("active");
                            }
                        }
                    }
                }
                
                // MAJ températures
                for (const [nom, temp] of Object.entries(data.temperatures)) {
                    const tempDiv = document.getElementById("temp-" + nom);
                    if (tempDiv && temp !== null) {
                        tempDiv.querySelector('span').textContent = temp + " °C";
                    }
                }
                
                updateTime();
            } catch (err) {
                console.error("Erreur lors de la mise à jour :", err);
            }
        }
        
        // Mise à jour initiale
        updateTime();
        
        // Rafraîchissement automatique
        setInterval(refreshEtats, 2000);
    </script>
</body>
</html>
